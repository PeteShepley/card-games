name: Release web

# Build clients/web once per environment and publish as a GitHub Release
# (tag web-v0.<run>). Deploy runs from operations:
# `scripts/deploy game gin-rummy <env> web-v0.<run>`.

on:
  push:
    branches: [main]
    paths: ["clients/web/**", ".github/workflows/release-web.yml"]

permissions:
  contents: write

concurrency: release-web-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test --workspace=web

      - name: Build (prod)
        run: |
          npm run build --workspace=web
          tar -czf dist-prod.tgz -C clients/web/dist .
          rm -rf clients/web/dist
        env:
          VITE_BASE_PATH: /gin-rummy/
          VITE_WS_URL: wss://ws.peteshepley.com/gin-rummy

      - name: Build (stage)
        run: |
          npm run build --workspace=web
          tar -czf dist-stage.tgz -C clients/web/dist .
          rm -rf clients/web/dist
        env:
          VITE_BASE_PATH: /gin-rummy/
          VITE_WS_URL: wss://ws.stage.peteshepley.com/gin-rummy

      - name: Manifest
        run: |
          jq -n --arg sha "$GITHUB_SHA" \
            '{type:"static", mode:"spa", base_path:"/gin-rummy/", commit:$sha}' > manifest.json

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="web-v0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist-prod.tgz dist-stage.tgz manifest.json \
            --title "$TAG" \
            --notes "web build of ${GITHUB_SHA:0:7} for game.peteshepley.com/gin-rummy"
