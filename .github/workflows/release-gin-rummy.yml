name: Release gin-rummy

# Build games/gin-rummy once per environment and publish as a GitHub Release
# (tag gin-rummy-v0.<run>). Deploy runs from operations:
# `scripts/deploy game gin-rummy <env> gin-rummy-v0.<run>`.
#
# Copy this file per game: swap the workspace name, base path and tag prefix.

on:
  push:
    branches: [main]
    paths:
      - "games/gin-rummy/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/release-gin-rummy.yml"

permissions:
  contents: write

concurrency: release-gin-rummy-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test --workspace=@card-games/card-kit --workspace=gin-rummy

      - name: Build (prod)
        run: |
          npm run build --workspace=gin-rummy
          tar -czf dist-prod.tgz -C games/gin-rummy/dist .
          rm -rf games/gin-rummy/dist
        env:
          VITE_BASE_PATH: /gin-rummy/
          VITE_WS_URL: wss://ws.peteshepley.com/relay

      - name: Build (stage)
        run: |
          npm run build --workspace=gin-rummy
          tar -czf dist-stage.tgz -C games/gin-rummy/dist .
          rm -rf games/gin-rummy/dist
        env:
          VITE_BASE_PATH: /gin-rummy/
          VITE_WS_URL: wss://ws.stage.peteshepley.com/relay

      - name: Manifest
        run: |
          jq -n --arg sha "$GITHUB_SHA" \
            '{type:"static", mode:"spa", base_path:"/gin-rummy/", commit:$sha}' > manifest.json

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="gin-rummy-v0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist-prod.tgz dist-stage.tgz manifest.json \
            --title "$TAG" \
            --notes "Build of ${GITHUB_SHA:0:7} for game.peteshepley.com/gin-rummy"
