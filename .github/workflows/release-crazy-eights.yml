name: Release crazy-eights

# Build games/crazy-eights once per environment and publish as a GitHub Release
# (tag crazy-eights-v0.<run>). Deploy runs from operations:
# `scripts/deploy game crazy-eights <env> crazy-eights-v0.<run>`.
#

on:
  push:
    branches: [main]
    paths:
      - "games/crazy-eights/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/release-crazy-eights.yml"

permissions:
  contents: write

concurrency: release-crazy-eights-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test --workspace=@card-games/card-kit --workspace=crazy-eights

      - name: Build (prod)
        run: |
          npm run build --workspace=crazy-eights
          tar -czf dist-prod.tgz -C games/crazy-eights/dist .
          rm -rf games/crazy-eights/dist
        env:
          VITE_BASE_PATH: /crazy-eights/
          VITE_WS_URL: wss://ws.peteshepley.com/relay

      - name: Build (stage)
        run: |
          npm run build --workspace=crazy-eights
          tar -czf dist-stage.tgz -C games/crazy-eights/dist .
          rm -rf games/crazy-eights/dist
        env:
          VITE_BASE_PATH: /crazy-eights/
          VITE_WS_URL: wss://ws.stage.peteshepley.com/relay

      - name: Manifest
        run: |
          jq -n --arg sha "$GITHUB_SHA" \
            '{type:"static", mode:"spa", base_path:"/crazy-eights/", commit:$sha}' > manifest.json

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="crazy-eights-v0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist-prod.tgz dist-stage.tgz manifest.json \
            --title "$TAG" \
            --notes "Build of ${GITHUB_SHA:0:7} for game.peteshepley.com/crazy-eights"
