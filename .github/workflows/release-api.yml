name: Release api

# Build services/api and publish function.zip as a GitHub Release
# (tag api-v0.<run>). Deploy runs from operations:
# `scripts/deploy api gin-rummy <env> api-v0.<run>`.

on:
  push:
    branches: [main]
    paths: ["services/api/**", ".github/workflows/release-api.yml"]

permissions:
  contents: write

concurrency: release-api-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=api

      - name: Package
        run: |
          (cd services/api/dist && zip -qr ../../../function.zip .)
          jq -n --arg sha "$GITHUB_SHA" \
            '{type:"lambda", runtime:"nodejs22.x", handler:"index.handler", commit:$sha}' > manifest.json

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="api-v0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" function.zip manifest.json \
            --title "$TAG" \
            --notes "api build of ${GITHUB_SHA:0:7} for api.peteshepley.com/gin-rummy/v1"
